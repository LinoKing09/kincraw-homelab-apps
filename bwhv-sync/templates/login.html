<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FWL Import – Anmelden</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171316">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root{--bwhv-gold:#ffcc00;--bwhv-orange:#f6a200;--bwhv-red:#e30613;
    --bg:#171316;--surface:#221c20;--surface-2:#2c242a;--line:#3d333b;--text:#f5f0f2;--muted:#a5969e;}
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;min-height:100vh;}
  header{padding:calc(24px + env(safe-area-inset-top)) 20px 18px;border-bottom:1px solid var(--line);}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bwhv-gold);font-weight:700;margin:0 0 6px;}
  h1{margin:0;font-size:24px;font-weight:800;}
  main{padding:20px;max-width:480px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  input[type=password]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;
    color:var(--text);font-size:16px;}
  input[type=password]:focus{outline:2px solid var(--bwhv-gold);outline-offset:1px;}
  button{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--bwhv-gold),var(--bwhv-orange));color:#241a02;font-family:inherit;}
  .err{background:rgba(227,6,19,.08);border:1px solid rgba(227,6,19,.35);color:#ff6b73;border-radius:12px;
    padding:12px 14px;font-size:13px;margin-bottom:16px;}
  .sub{color:var(--muted);font-size:13px;line-height:1.5;margin:14px 0 0;}
</style>
</head>
<body>
<header>
  <p class="eyebrow">BWHV Schiri FWL</p>
  <h1>Anmelden</h1>
</header>
<main>
  <form class="card" method="post" action="/login">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pw">Passwort</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Anmelden</button>
    <p class="sub">Auf diesem Gerät angemeldet bleiben – die Anmeldung gilt für mehrere Wochen.</p>
  </form>
</main>
</body>
</html>
