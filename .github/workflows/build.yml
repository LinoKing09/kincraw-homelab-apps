name: Build & Push Images

# Jeder Push auf main baut die Images neu und legt sie in die
# GitHub Container Registry. docker1 holt sie sich per Update-Timer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests bwhv-sync
        working-directory: bwhv-sync
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/
      - name: Syntax-Check untis-sync und kiosk
        run: |
          python -m py_compile untis-sync/*.py kiosk/remote/app.py kiosk/pi/kiosk.py
          bash -n kiosk/pi/kiosk-run.sh kiosk/pi/install.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bwhv-sync
            context: bwhv-sync
          - app: untis-sync
            context: untis-sync
          - app: kiosk-remote
            context: kiosk/remote
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Namen (Kleinbuchstaben) setzen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
